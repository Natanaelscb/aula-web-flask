{% extends 'admim/base.html' %}

{% block content %}
  <h1>Lista de Categoria</h1>

  <table class="table">
    <thead>
      <tr>
        <th scope="col">ID</th>
        <th scope="col">Nome</th>
        <th scope="col">Foto</th>
      </tr>
    </thead>
    <tbody>
      {% for i in Categoria  %}
      <tr>
        <th scope="row">{{i[0]}}</th>
        <td>{{i[1]}}</td>
        <td>{{i[6]}}</td>
      </tr>
      {% endfor %}  
    </tbody>
  </table>
{% endblock %}
